<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- [버그 수정 - 모바일 하단 빈 공간] viewport 메타 태그가 누락되어
       모바일 브라우저가 기본 데스크톱 너비(약 980px)로 렌더링 후 화면에
       맞춰 축소했다. 그 결과 Flutter UI가 실제 화면보다 훨씬 넓은
       뷰포트를 기준으로 배치되어, 콘텐츠가 화면 상단에 압축되고 나머지는
       거대한 빈 공간(흰 배경 또는 다크 배경)으로 남는 문제가 발생했다.
       표준 Flutter 웹 프로젝트의 기본 viewport 태그를 복원한다. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="신통도령과 함께하는 오늘의 사주 · 타로 · 궁합. 나만을 위한 운세를 지금 만나보세요.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="신통방통">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>신통방통 - 오늘의 운세, 사주, 타로</title>
  <link rel="manifest" href="manifest.json">

  <!-- [카카오톡 등 SNS 공유 미리보기 카드] Open Graph 메타태그
       사용자가 sintong.kr을 카톡/문자 등에 붙여넣었을 때, 링크가 그냥
       파란 텍스트가 아니라 신통도령 캐릭터가 담긴 예쁜 카드로 보이도록
       한다. og:image는 절대 URL이어야 카톡 크롤러가 정상적으로 읽는다. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="신통방통">
  <meta property="og:title" content="신통방통 - 신통도령과 함께하는 오늘의 운세">
  <meta property="og:description" content="사주 · 타로 · 궁합 · 귀인지도까지, 신통도령이 들려주는 오늘 당신의 운명 이야기를 만나보세요.">
  <meta property="og:image" content="https://sintong.kr/app/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:url" content="https://sintong.kr/app/">
  <meta property="og:locale" content="ko_KR">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="신통방통 - 신통도령과 함께하는 오늘의 운세">
  <meta name="twitter:description" content="사주 · 타로 · 궁합 · 귀인지도까지, 신통도령이 들려주는 오늘 당신의 운명 이야기를 만나보세요.">
  <meta name="twitter:image" content="https://sintong.kr/app/og-image.png">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
