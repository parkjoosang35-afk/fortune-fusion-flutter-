<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- [버그 수정 - 모바일 하단 빈 공간] viewport 메타 태그가 누락되어
       모바일 브라우저가 기본 데스크톱 너비(약 980px)로 렌더링 후 화면에
       맞춰 축소했다. 그 결과 Flutter UI가 실제 화면보다 훨씬 넓은
       뷰포트를 기준으로 배치되어, 콘텐츠가 화면 상단에 압축되고 나머지는
       거대한 빈 공간(흰 배경 또는 다크 배경)으로 남는 문제가 발생했다.
       표준 Flutter 웹 프로젝트의 기본 viewport 태그를 복원한다. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="신통도령과 함께하는 오늘의 사주 · 타로 · 궁합. 나만을 위한 운세를 지금 만나보세요.">

  <!-- [웹 소셜로그인 활성화] google_sign_in_web(GIS SDK)이 초기화 시 이
       메타태그에서 Client ID를 읽는다(플러그인 소스: google_sign_in_web.dart
       의 clientIdMetaName='google-signin-client_id'). social_auth_service.dart
       에서도 kIsWeb일 때 clientId를 직접 넘기므로 이중 안전장치이지만,
       구글 공식 문서가 메타태그 방식을 표준으로 권장하므로 함께 추가한다. -->
  <meta name="google-signin-client_id" content="29545196276-5udpd2jkpdvu2jetj0tjc5bb81e8alg6.apps.googleusercontent.com">
  <!--
    [웹 소셜로그인 활성화] 카카오 JavaScript SDK. kakao_flutter_sdk_common의
    웹 구현(kakao_flutter_sdk_plugin.dart)은 window.Kakao 전역 객체를
    사용하므로, 카카오 공식 CDN 스크립트를 미리 로드해 둬야 한다. 버전은
    카카오 SDK JS v2 계열(현재 카카오 디벨로퍼스 공식 권장 버전)을 사용한다.
  -->
  <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.4/kakao.min.js"
    integrity="sha384-DKYJZ8NLiK8MN4/C5P2dtSmLQ4KwPaoqAfyA/DfmEc1VDxu4yyC7wy6K1Hs90nka"
    crossorigin="anonymous"></script>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="신통방통">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>신통방통 - 오늘의 운세, 사주, 타로</title>
  <link rel="manifest" href="manifest.json">

  <!-- [카카오톡 등 SNS 공유 미리보기 카드] Open Graph 메타태그
       사용자가 sintong.kr을 카톡/문자 등에 붙여넣었을 때, 링크가 그냥
       파란 텍스트가 아니라 방통선녀 캐릭터가 담긴 예쁜 카드로 보이도록
       한다. og:image는 절대 URL이어야 카톡 크롤러가 정상적으로 읽는다.
       [2026-09-19 캐릭터 교체] 신통도령(남) → 방통선녀(여)로 전면 교체됨에
       따라 텍스트 문구도 "신통도령이 들려주는"에서 캐릭터명을 제거한
       중립 문구로 수정. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="신통방통">
  <meta property="og:title" content="신통방통 - 오늘 당신의 운명을 만나보세요">
  <meta property="og:description" content="사주 · 타로 · 궁합 · 귀인지도까지, 신통방통이 들려주는 오늘 당신의 운명 이야기를 만나보세요.">
  <meta property="og:image" content="https://sintong.kr/app/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:url" content="https://sintong.kr/app/">
  <meta property="og:locale" content="ko_KR">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="신통방통 - 오늘 당신의 운명을 만나보세요">
  <meta name="twitter:description" content="사주 · 타로 · 궁합 · 귀인지도까지, 신통방통이 들려주는 오늘 당신의 운명 이야기를 만나보세요.">
  <meta name="twitter:image" content="https://sintong.kr/app/og-image.png">

  <!-- [버그 수정 - 로딩 중 흰 화면 깜빡임] Flutter 엔진이 완전히 로드되어
       화면을 그리기까지(main.dart.js 다운로드+파싱, 15초 이상 걸릴 수 있음)
       브라우저는 <body>의 기본 배경(흰색)을 그대로 보여준다. 앱의 실제
       테마 색상(다크 네이비~퍼플 그라데이션, intro_palette.dart의
       backgroundTop/backgroundBottom과 동일)과 전혀 다른 흰색이 로딩 내내
       노출되어 "흰 바탕이 앱 색상과 안 맞는다"는 문제가 발생했다.
       body에 동일한 그라데이션 배경 + 로딩 스피너를 CSS로 미리 그려서,
       Flutter가 화면을 그리기 전까지도 앱과 일관된 색감을 유지한다.
       Flutter 첫 프레임이 렌더링되면 flutter-view가 body 위에 올라오면서
       이 로딩 화면을 자연스럽게 덮는다. -->
  <meta name="theme-color" content="#1E1A3A">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: linear-gradient(to bottom, #3D3568, #1E1A3A);
    }
    #app-loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(to bottom, #3D3568, #1E1A3A);
      z-index: 9999;
    }
    #app-loading .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 255, 255, 0.25);
      border-top-color: rgba(255, 255, 255, 0.9);
      border-radius: 50%;
      animation: app-loading-spin 0.9s linear infinite;
    }
    @keyframes app-loading-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="app-loading"><div class="spinner"></div></div>
  <script>
    // Flutter Web이 첫 프레임을 그리면 'flutter-first-frame' 이벤트를 쏘아준다.
    // 그 시점에 로딩용 그라데이션/스피너를 페이드아웃하며 제거한다.
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('app-loading');
      if (!el) return;
      el.style.transition = 'opacity 200ms ease-out';
      el.style.opacity = '0';
      setTimeout(function () { el.remove(); }, 220);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
